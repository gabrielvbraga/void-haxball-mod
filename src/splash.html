<!doctype html>
<!-- VOID HaxBall Mod - tela de abertura. Só HTML e CSS (sem script): a logo se desenha e a barra corre. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>VOID</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: radial-gradient(120% 90% at 50% 40%, #121216 0%, #08080a 62%);
    color: #ececef; font: 11px/1 system-ui, "Segoe UI", sans-serif; overflow: hidden;
    -webkit-app-region: drag; user-select: none;
  }
  body::before {                                   /* moldura fina */
    content: ""; position: fixed; inset: 0; border: 1px solid rgba(255, 255, 255, .07); pointer-events: none;
  }
  svg { width: 300px; height: auto; overflow: visible; }
  .w { fill: none; stroke: #fff; stroke-width: 9; stroke-linejoin: miter; stroke-miterlimit: 8;
       stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .9s cubic-bezier(.6, 0, .2, 1) forwards; }
  .w:nth-child(2) { animation-delay: .12s; }
  .w:nth-child(3) { animation-delay: .24s; }
  .w:nth-child(4) { animation-delay: .36s; }
  .slash { fill: none; stroke: #e0212f; stroke-width: 8; stroke-dasharray: 1; stroke-dashoffset: 1;
           animation: draw .45s cubic-bezier(.7, 0, .2, 1) .95s forwards; filter: drop-shadow(0 0 10px rgba(224, 33, 47, .55)); }
  .sub { letter-spacing: .62em; text-indent: .62em; font-weight: 600; color: #8b8d96; opacity: 0; animation: in .6s ease 1.25s forwards; }
  .bar { position: relative; width: 150px; height: 1px; background: rgba(255, 255, 255, .09); overflow: hidden; opacity: 0; animation: in .4s ease 1.4s forwards; }
  .bar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; background: #e0212f; animation: run 1.3s ease-in-out 1.4s infinite; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes in { to { opacity: 1; } }
  @keyframes run { from { left: -40%; } to { left: 100%; } }
  @media (prefers-reduced-motion: reduce) {
    .w, .slash { animation: none; stroke-dashoffset: 0; }
    .sub, .bar { animation: none; opacity: 1; }
    .bar::after { animation: none; left: 30%; }
  }
</style>
</head>
<body>
  <svg viewBox="0 0 326 120" role="img" aria-label="VOID">
    <polyline class="w" pathLength="1" points="6,10 44,108 82,10"/>
    <circle class="w" pathLength="1" cx="142" cy="60" r="45.5"/>
    <line class="w" pathLength="1" x1="222" y1="10" x2="222" y2="110"/>
    <path class="w" pathLength="1" d="M252 14.5H270a45.5 45.5 0 0 1 0 91H252Z"/>
    <line class="slash" pathLength="1" x1="112" y1="118" x2="172" y2="2"/>
  </svg>
  <div class="sub">HAXBALL MOD</div>
  <div class="bar"></div>
</body>
</html>
